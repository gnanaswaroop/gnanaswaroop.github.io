  <style>
    :root {
      --bg: #fbfaf7;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --border: #e2dfd8;
      --hover: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141416;
        --text: #ececef;
        --muted: #9a9aa2;
        --border: #2c2c31;
        --hover: #1d1d21;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 2.5rem);
      letter-spacing: -0.02em;
    }
    p.tagline {
      margin: 0 0 32px;
      color: var(--muted);
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    nav svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }
    nav a:hover, nav a:focus-visible {
      background: var(--hover);
      border-color: var(--muted);
      outline: none;
    }
    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
